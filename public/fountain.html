<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фонтан карток</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #7ec8e3;
    --sky-mid: #b8e0d2;
    --sky-bot: #f0e6d8;
    --ink: #1a2a2e;
    --panel: rgba(255, 252, 247, 0.82);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 120% 80% at 50% 100%, #ffe8a3 0%, transparent 45%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bot) 100%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.35) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 20%, rgba(255,255,255,0.28) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 40% 60%, rgba(255,255,255,0.22) 0 2px, transparent 3px),
      radial-gradient(circle at 85% 55%, rgba(255,255,255,0.3) 0 1px, transparent 2px);
    opacity: 0.7;
  }

  .hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 22px;
    pointer-events: none;
  }

  .hud > * { pointer-events: auto; }

  .brand {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    letter-spacing: -0.02em;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }

  .stats {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .stat {
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(26, 42, 46, 0.08);
    border-radius: 12px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 0.9rem;
    min-width: 88px;
    text-align: center;
  }

  .stat span {
    display: block;
    font-size: 0.65rem;
    font-weight: 500;
    opacity: 0.55;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: min(920px, calc(100% - 24px));
  }

  .panel {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 18px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(26, 42, 46, 0.1);
    border-radius: 16px;
    padding: 12px 16px;
  }

  .control {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 140px;
  }

  .control label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.55;
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .control output {
    font-weight: 700;
    font-size: 0.9rem;
    min-width: 2.4em;
    text-align: right;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 6px;
    border-radius: 999px;
    background: rgba(26, 42, 46, 0.15);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #1a2a2e;
    border: 2px solid #f7f3eb;
    box-shadow: 0 2px 6px rgba(26, 42, 46, 0.25);
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #1a2a2e;
    border: 2px solid #f7f3eb;
    box-shadow: 0 2px 6px rgba(26, 42, 46, 0.25);
  }

  input[type="number"] {
    width: 64px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    border: 1px solid rgba(26, 42, 46, 0.15);
    border-radius: 10px;
    padding: 6px 8px;
    background: #fff;
    color: var(--ink);
  }

  .checks {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
  }

  .check {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }

  .check input {
    width: 16px;
    height: 16px;
    accent-color: #1a2a2e;
    cursor: pointer;
  }

  .actions {
    display: flex;
    gap: 8px;
  }

  button {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    border: none;
    border-radius: 14px;
    padding: 12px 18px;
    cursor: pointer;
    background: #1a2a2e;
    color: #f7f3eb;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  button:hover { transform: translateY(-1px); background: #2c4046; }
  button:active { transform: translateY(1px); }
  button.ghost {
    background: #fff;
    color: var(--ink);
    border: 1px solid rgba(26, 42, 46, 0.12);
  }

  .hint {
    position: fixed;
    bottom: 118px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    font-size: 0.85rem;
    opacity: 0.65;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  .hint.fade { opacity: 0; }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  .fountain {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 120px;
    height: 72px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 5;
  }

  .fountain-bowl {
    position: absolute;
    left: 50%;
    bottom: 18px;
    width: 88px;
    height: 28px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #4a8f9e, #2f6b78);
    border-radius: 50% 50% 40% 40%;
    box-shadow: 0 6px 16px rgba(26, 42, 46, 0.2);
  }

  .fountain-base {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 48px;
    height: 28px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #3d7a88, #255560);
    border-radius: 6px 6px 0 0;
  }

  .fountain-spray {
    position: absolute;
    left: 50%;
    bottom: 40px;
    width: 10px;
    height: 10px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    animation: spray 1.4s ease-out infinite;
  }

  @keyframes spray {
    0% { opacity: 0.8; transform: translateX(-50%) scale(0.6); box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
    70% { opacity: 0; transform: translateX(-50%) scale(2.4); box-shadow: 0 -18px 20px 8px rgba(255,255,255,0.15); }
    100% { opacity: 0; transform: translateX(-50%) scale(2.6); }
  }

  .card {
    position: absolute;
    width: 64px;
    height: 84px;
    margin-left: -32px;
    margin-top: -42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 1.65rem;
    color: #fff;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    will-change: transform, opacity;
    box-shadow:
      0 10px 22px rgba(26, 42, 46, 0.22),
      inset 0 1px 0 rgba(255,255,255,0.35);
    border: 2px solid rgba(255,255,255,0.35);
    transition: filter 0.12s ease;
  }

  .card:hover { filter: brightness(1.08); }
  .card:active { filter: brightness(0.95); }

  .card.popping {
    pointer-events: none;
    animation: pop 0.32s ease-out forwards;
  }

  @keyframes pop {
    0% { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1); opacity: 1; }
    40% { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1.25); opacity: 1; }
    100% { transform: translate(var(--x), calc(var(--y) - 28px)) rotate(var(--r)) scale(0.2); opacity: 0; }
  }

  .burst {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 12;
    animation: burst 0.45s ease-out forwards;
  }

  @keyframes burst {
    to {
      transform: translate(var(--dx), var(--dy)) scale(0);
      opacity: 0;
    }
  }

  @media (max-width: 640px) {
    .card { width: 52px; height: 68px; margin-left: -26px; margin-top: -34px; font-size: 1.35rem; }
    .hud { padding: 14px 14px; flex-wrap: wrap; }
    .stat { min-width: 72px; padding: 6px 10px; font-size: 0.8rem; }
    .controls { bottom: 12px; }
    .hint { bottom: 150px; }
    .control { min-width: 120px; }
    input[type="range"] { width: 100px; }
  }
</style>
</head>
<body>
  <div class="hud">
    <div class="brand">Фонтан карток</div>
    <div class="stats">
      <div class="stat"><span>Зібрано</span><strong id="score">0</strong></div>
      <div class="stat"><span>У повітрі</span><strong id="alive">0</strong></div>
    </div>
  </div>

  <div id="stage">
    <div class="fountain" aria-hidden="true">
      <div class="fountain-spray"></div>
      <div class="fountain-bowl"></div>
      <div class="fountain-base"></div>
    </div>
  </div>

  <p class="hint" id="hint">Клікай по картках, поки вони падають</p>

  <div class="controls">
    <div class="panel">
      <div class="control">
        <label for="speedRange">Швидкість</label>
        <div class="control-row">
          <input id="speedRange" type="range" min="10" max="150" value="55" step="5">
          <output id="speedOut" for="speedRange">55%</output>
        </div>
      </div>
      <div class="control">
        <label for="maxNumber">Макс. цифра</label>
        <div class="control-row">
          <input id="maxNumber" type="number" min="0" max="999" value="10" step="1">
        </div>
      </div>
      <div class="control">
        <label>Вміст карток</label>
        <div class="checks">
          <label class="check"><input type="checkbox" id="optDigits" checked> Цифри</label>
          <label class="check"><input type="checkbox" id="optUk"> Українські</label>
          <label class="check"><input type="checkbox" id="optPl"> Польські</label>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="burstBtn">Викинути пачку</button>
        <button type="button" class="ghost" id="toggleBtn">Пауза</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const stage = document.getElementById("stage");
  const scoreEl = document.getElementById("score");
  const aliveEl = document.getElementById("alive");
  const hintEl = document.getElementById("hint");
  const burstBtn = document.getElementById("burstBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const speedRange = document.getElementById("speedRange");
  const speedOut = document.getElementById("speedOut");
  const maxNumberInput = document.getElementById("maxNumber");
  const optDigits = document.getElementById("optDigits");
  const optUk = document.getElementById("optUk");
  const optPl = document.getElementById("optPl");

  const COLORS = [
    "#e85d4c", "#f0a202", "#2a9d8f", "#457b9d",
    "#e76f51", "#6a994e", "#d64045", "#3d5a80",
    "#bc4749", "#f4a261", "#2d6a4f", "#e9c46a"
  ];

  const UK_LETTERS = "АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ".split("");
  const PL_LETTERS = "AĄBCĆDEĘFGHIJKLŁMNŃOÓPRSŚTUWYZŹŻ".split("");

  const cards = [];
  let score = 0;
  let running = true;
  let nextId = 1;
  let spawnTimer = 0;
  let lastTs = 0;
  let hintHidden = false;
  let speedScale = Number(speedRange.value) / 100;
  let maxNumber = 10;

  const GRAVITY = 980;
  const DRAG = 0.995;

  function getMaxNumber() {
    const raw = Number(maxNumberInput.value);
    if (!Number.isFinite(raw)) return 10;
    return Math.max(0, Math.min(999, Math.floor(raw)));
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function randomSymbol() {
    const pools = [];
    if (optDigits.checked) {
      const max = getMaxNumber();
      pools.push(() => String(Math.floor(Math.random() * (max + 1))));
    }
    if (optUk.checked) pools.push(() => pick(UK_LETTERS));
    if (optPl.checked) pools.push(() => pick(PL_LETTERS));
    if (!pools.length) {
      optDigits.checked = true;
      const max = getMaxNumber();
      return String(Math.floor(Math.random() * (max + 1)));
    }
    return pick(pools)();
  }

  function fountainOrigin() {
    return {
      x: window.innerWidth / 2,
      y: window.innerHeight - 52
    };
  }

  function spawnCard() {
    const origin = fountainOrigin();
    // Target apex near the top of the screen (independent of speed slider).
    // v^2 = 2 g h  =>  vy = -sqrt(2 g h)
    const targetApexY = 36 + Math.random() * 90;
    const riseHeight = Math.max(180, origin.y - targetApexY);
    const vyUp = Math.sqrt(2 * GRAVITY * riseHeight);
    // Horizontal velocity so cards fan across nearly the full screen width.
    // At apex, x ≈ origin.x + vx * (vyUp / g); solve for full-width coverage.
    const flightTimeToApex = vyUp / GRAVITY;
    const halfSpan = Math.max(80, window.innerWidth * 0.48);
    const spread = (Math.random() - 0.5) * 2 * (halfSpan / Math.max(0.2, flightTimeToApex));
    const el = document.createElement("button");
    el.type = "button";
    el.className = "card";
    el.textContent = randomSymbol();
    el.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.setAttribute("aria-label", `Картка ${el.textContent}`);

    const card = {
      id: nextId++,
      el,
      x: origin.x + (Math.random() - 0.5) * 18,
      y: origin.y,
      vx: spread,
      vy: -vyUp,
      rot: (Math.random() - 0.5) * 40,
      vr: (Math.random() - 0.5) * 120,
      dead: false,
      phase: "rise"
    };

    el.style.setProperty("--x", `${card.x}px`);
    el.style.setProperty("--y", `${card.y}px`);
    el.style.setProperty("--r", `${card.rot}deg`);
    el.style.transform = `translate(${card.x}px, ${card.y}px) rotate(${card.rot}deg)`;

    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      catchCard(card);
    });

    stage.appendChild(el);
    cards.push(card);
    updateAlive();

    if (!hintHidden) {
      hintHidden = true;
      setTimeout(() => hintEl.classList.add("fade"), 1800);
    }

    return card;
  }

  function spawnBurst(n = 8) {
    for (let i = 0; i < n; i++) {
      setTimeout(() => spawnCard(), i * 55);
    }
  }

  function catchCard(card) {
    if (card.dead) return;
    card.dead = true;
    score += 1;
    scoreEl.textContent = String(score);

    card.el.style.setProperty("--x", `${card.x}px`);
    card.el.style.setProperty("--y", `${card.y}px`);
    card.el.style.setProperty("--r", `${card.rot}deg`);
    card.el.classList.add("popping");

    spawnBurstParticles(card.x, card.y, getComputedStyle(card.el).backgroundColor);

    setTimeout(() => {
      card.el.remove();
      const idx = cards.indexOf(card);
      if (idx >= 0) cards.splice(idx, 1);
      updateAlive();
    }, 320);
  }

  function spawnBurstParticles(x, y, color) {
    for (let i = 0; i < 7; i++) {
      const p = document.createElement("div");
      p.className = "burst";
      const a = (Math.PI * 2 * i) / 7 + Math.random() * 0.4;
      const d = 28 + Math.random() * 36;
      p.style.left = `${x}px`;
      p.style.top = `${y}px`;
      p.style.background = color;
      p.style.setProperty("--dx", `${Math.cos(a) * d}px`);
      p.style.setProperty("--dy", `${Math.sin(a) * d}px`);
      stage.appendChild(p);
      setTimeout(() => p.remove(), 450);
    }
  }

  function updateAlive() {
    aliveEl.textContent = String(cards.filter((c) => !c.dead).length);
  }

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    const rawDt = Math.min(0.033, (ts - lastTs) / 1000);
    lastTs = ts;
    const dt = rawDt * speedScale;

    if (running) {
      spawnTimer -= rawDt;
      if (spawnTimer <= 0) {
        spawnCard();
        const interval = (0.45 + Math.random() * 0.7) / Math.max(0.25, speedScale);
        spawnTimer = interval;
      }

      const floor = window.innerHeight + 120;
      const left = -80;
      const right = window.innerWidth + 80;

      for (let i = cards.length - 1; i >= 0; i--) {
        const c = cards[i];
        if (c.dead) continue;

        c.vy += GRAVITY * dt;
        c.vx *= Math.pow(DRAG, speedScale);
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.rot += c.vr * dt;

        if (c.vy > 0) c.phase = "fall";

        c.el.style.transform = `translate(${c.x}px, ${c.y}px) rotate(${c.rot}deg)`;

        if (c.y > floor || c.x < left || c.x > right) {
          c.el.remove();
          cards.splice(i, 1);
          updateAlive();
        }
      }
    }

    requestAnimationFrame(tick);
  }

  function syncSpeedUI() {
    speedScale = Number(speedRange.value) / 100;
    speedOut.textContent = `${speedRange.value}%`;
  }

  speedRange.addEventListener("input", syncSpeedUI);
  maxNumberInput.addEventListener("change", () => {
    maxNumber = getMaxNumber();
    maxNumberInput.value = String(maxNumber);
  });

  function setPaused(paused) {
    running = !paused;
    toggleBtn.textContent = running ? "Пауза" : "Далі";
    if (running) lastTs = 0;
  }

  burstBtn.addEventListener("click", () => spawnBurst(10));
  toggleBtn.addEventListener("click", () => setPaused(running));

  window.addEventListener("keydown", (e) => {
    if (e.code !== "Space" && e.key !== " ") return;
    if (e.target.closest("input, textarea, select, button")) return;
    e.preventDefault();
    setPaused(running);
  });

  syncSpeedUI();
  maxNumber = getMaxNumber();
  spawnBurst(6);
  spawnTimer = 0.8;
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
